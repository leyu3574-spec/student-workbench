name: 构建

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  apk:
    name: 安卓 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: 写入版本号
        run: sed -i "s/__BUILD__/${{ github.run_number }}/g" www/app.js www/sw.js
      - name: 安装依赖
        run: npm install --no-audit --no-fund
      - name: 带上原生插件的桥接脚本（没有它，通知和文件导出都连不上）
        run: |
          mkdir -p www/vendor/cap
          cp node_modules/@capacitor/core/dist/capacitor.js www/vendor/cap/core.js
          cp node_modules/@capacitor/local-notifications/dist/plugin.js www/vendor/cap/local-notifications.js
          cp node_modules/@capacitor/filesystem/dist/plugin.js www/vendor/cap/filesystem.js
          cp node_modules/@capacitor/share/dist/plugin.js www/vendor/cap/share.js
          ls -la www/vendor/cap
      - name: 生成安卓工程
        run: |
          npx cap add android
          cp -r resources/android/res/. android/app/src/main/res/
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"0.5.${{ github.run_number }}\"/" android/app/build.gradle
          npx cap sync android
      - name: 固定签名（覆盖安装时数据不丢）
        env:
          KS: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > ~/.android/debug.keystore
          else
            echo "::warning::没有设置 ANDROID_DEBUG_KEYSTORE，本次是临时签名，无法覆盖安装旧版本"
          fi
      - name: 编译
        run: cd android && ./gradlew assembleDebug --no-daemon
      - name: 发布到 Releases
        run: cp android/app/build/outputs/apk/debug/app-debug.apk workbench-0.5.${{ github.run_number }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.${{ github.run_number }}
          name: 学生工作台 0.5.${{ github.run_number }}
          files: workbench-0.5.${{ github.run_number }}.apk

  web:
    name: 网页版（平板用）
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: 写入版本号
        run: sed -i "s/__BUILD__/${{ github.run_number }}/g" www/app.js www/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4
