name: 构建

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  apk:
    name: 安卓 APK
    runs-on: ubuntu-24.04 # 固定系统版本；ubuntu-latest 10 月 19 日起会换成 Ubuntu 26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: 写入版本号
        run: sed -i "s/__BUILD__/${{ github.run_number }}/g" www/app.js www/sw.js
      - name: 安装依赖
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: 带上原生插件的桥接脚本（没有它，通知和文件导出都连不上）
        run: |
          mkdir -p www/vendor/cap
          cp node_modules/@capacitor/core/dist/capacitor.js www/vendor/cap/core.js
          cp node_modules/@capacitor/local-notifications/dist/plugin.js www/vendor/cap/local-notifications.js
          cp node_modules/@capacitor/filesystem/dist/plugin.js www/vendor/cap/filesystem.js
          cp node_modules/@capacitor/share/dist/plugin.js www/vendor/cap/share.js
          cp node_modules/@capacitor-community/speech-recognition/dist/plugin.js www/vendor/cap/speech.js || echo "语音插件没找到，跳过"
          ls -la www/vendor/cap
      - name: 生成安卓工程
        run: |
          npx cap add android
          cp -r resources/android/res/. android/app/src/main/res/
          sed -i 's#</manifest>#    <queries><intent><action android:name="android.speech.RecognitionService" /></intent></queries>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          # our small native bridge for the reminder settings pages
          cp resources/android/java/*.java android/app/src/main/java/com/student/workbench/
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"0.8.${{ github.run_number }}\"/" android/app/build.gradle
          npx cap sync android
      - name: 固定签名（每一版都用同一把钥匙，才能不卸载直接覆盖安装）
        env:
          KS: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::仓库里没有 ANDROID_DEBUG_KEYSTORE 这个密钥，停止构建，免得打出一个装不上去的包"
            exit 1
          fi
          echo "$KS" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/wb.keystore"
          echo "WB_KEYSTORE=$RUNNER_TEMP/wb.keystore" >> "$GITHUB_ENV"
          # sign explicitly with our key instead of relying on where Gradle looks for a debug key
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile file(System.getenv('WB_KEYSTORE'))
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          }
          GRADLE
      - name: 编译
        run: cd android && ./gradlew assembleDebug --no-daemon
      - name: 核对签名指纹（每次都应该一样）
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          GOT=$("$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK" | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}')
          WANT=$(keytool -list -v -keystore "$WB_KEYSTORE" -storepass android -alias androiddebugkey | grep -i 'SHA256:' | head -1 | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')
          echo "安装包签名指纹：$GOT"
          if [ "$GOT" != "$WANT" ]; then echo "::error::签名和固定密钥对不上"; exit 1; fi
      - name: 发布到 Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk workbench-0.8.${{ github.run_number }}.apk
          gh release create "v0.8.${{ github.run_number }}" "workbench-0.8.${{ github.run_number }}.apk" \
            --repo "${{ github.repository }}" --title "学生工作台 0.8.${{ github.run_number }}" --notes "自动构建"

  web:
    name: 网页版（平板用）
    runs-on: ubuntu-24.04 # 固定系统版本；ubuntu-latest 10 月 19 日起会换成 Ubuntu 26
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - name: 写入版本号
        run: sed -i "s/__BUILD__/${{ github.run_number }}/g" www/app.js www/sw.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v5
